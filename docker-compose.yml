services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-rag-api
    restart: unless-stopped
    environment:
      DATABASE_BACKEND: local
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash-lite,gemini-2.5-flash-lite}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-700}
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 8000
      WEATHER_ALLOW_SYNC: "0"
    ports:
      - "8000:8000"
