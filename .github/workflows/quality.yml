name: quality

on:
  push:
    branches: [main, 'upgrade/**', 'ci/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Validate Docker Compose configuration
        run: |
          GEMINI_API_KEY=ci-placeholder docker compose config --quiet
      - name: Verify production dependency boundary
        run: |
          ! grep -E '^(torch|sentence-transformers)([<>=!~]|$)' requirements-runtime.txt
          grep -E '^sentence-transformers>=' requirements-rag-ml.txt
          grep -E '^torch>=' requirements-rag-ml.txt
      - name: Run tests
        run: python -m pytest -q
